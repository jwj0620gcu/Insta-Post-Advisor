services:
  - type: web
    name: insta-advisor
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # === LLM (Gemini OpenAI 호환) ===
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL_PRO
        value: gemini-2.5-flash
      - key: LLM_MODEL_OMNI
        value: gemini-2.5-flash
      - key: LLM_MODEL_FAST
        value: gemini-2.5-flash-lite
      - key: LLM_FREE_TIER_MODE
        value: "off"
      - key: LLM_RATE_LIMIT_RETRIES
        value: "3"
      - key: PLATFORM
        value: instagram
      - key: ALLOWED_ORIGINS
        value: "https://insta-post-advisor.onrender.com"
      # === 영상 업로드/처리 한도 ===
      # 영상 처리(STT/Gemini/프레임)가 디스크 스트리밍 기반이라 peak RAM이 영상 크기와
      # 무관해졌으므로 무료 인스턴스(512MB)에서도 한도를 넉넉히 둘 수 있다.
      - key: MAX_VIDEO_UPLOAD_MB
        value: "200"
      # 단일 동기 요청이 너무 길면 프록시 502가 나므로 STT 대기 상한을 둔다.
      - key: VIDEO_STT_TIMEOUT_SEC
        value: "120"
      # === 영상 STT (Groq whisper-large-v3-turbo) — ffmpeg는 Docker 이미지에 포함 ===
      - key: VIDEO_STT_ENABLED
        value: "1"
      - key: OPENAI_WHISPER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_WHISPER_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: VIDEO_STT_LANGUAGE
        value: ko
      # === 영속 저장 (Turso/libSQL) — 재배포 시 진단 이력/사용로그 유지 ===
      # 미설정 시 로컬 파일로 폴백(무료 플랜에서는 재배포마다 초기화됨)
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
