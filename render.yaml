services:
  - type: web
    name: insta-advisor
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # === LLM (Gemini OpenAI 호환) ===
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: LLM_MODEL_PRO
        value: gemini-2.5-flash-lite
      - key: LLM_MODEL_OMNI
        value: gemini-2.5-flash-lite
      - key: LLM_MODEL_FAST
        value: gemini-2.5-flash-lite
      - key: LLM_FREE_TIER_MODE
        value: "off"
      - key: LLM_RATE_LIMIT_RETRIES
        value: "3"
      - key: PLATFORM
        value: instagram
      - key: ALLOWED_ORIGINS
        value: "https://insta-post-advisor.onrender.com"
      # === 영상 STT (Groq whisper-large-v3-turbo) — ffmpeg는 Docker 이미지에 포함 ===
      - key: VIDEO_STT_ENABLED
        value: "1"
      - key: OPENAI_WHISPER_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_WHISPER_API_KEY
        sync: false
      - key: WHISPER_MODEL
        value: whisper-large-v3-turbo
      - key: VIDEO_STT_LANGUAGE
        value: ko
